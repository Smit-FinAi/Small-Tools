<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The PDF Factory — by Smit Parekh</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f5f7fc;--sur:#fff;--sur2:#f0f2f8;--sur3:#e6e9f4;--txt:#0f1117;--txt2:#374151;--muted:#6b7280;--bdr:#e2e5f1;--shadow:0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 12px 36px rgba(0,0,0,.12);--acc:#6366f1;--acc2:#06b6d4;--r:14px;--h:#fff}
[data-theme="dark"]{--bg:#0c0e18;--sur:#141826;--sur2:#1b1f30;--sur3:#22283d;--txt:#f0f4ff;--txt2:#c8d0e8;--muted:#5f6a84;--bdr:#252d48;--shadow:0 2px 8px rgba(0,0,0,.3);--shadow-lg:0 12px 36px rgba(0,0,0,.5);--h:#141826}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:'Roboto',sans-serif}
input[type="file"]{display:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:10px}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:var(--h);border-bottom:1px solid var(--bdr);box-shadow:var(--shadow);height:60px;display:flex;align-items:center;padding:0 24px;gap:16px;backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:default}
.logo-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#ef4444,#f97316);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(239,68,68,.3);flex-shrink:0}
.logo-name{font-size:14px;font-weight:700;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.logo-by{font-size:10px;color:var(--muted);margin-top:2px;font-weight:400}
.srch{flex:1;max-width:340px;position:relative}
.srch input{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:24px;padding:8px 16px 8px 36px;font-size:13px;color:var(--txt);outline:none;transition:border-color .2s,box-shadow .2s}
.srch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.srch input::placeholder{color:var(--muted)}
.srch-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.pbtn{background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--txt2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap;font-weight:500}
.pbtn:hover{background:var(--sur3)}

/* MAIN */
.main{max-width:1300px;margin:0 auto;padding:32px 24px 80px}

/* HERO */
.hero{text-align:center;padding:28px 0 40px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--muted);margin-bottom:16px;font-weight:500;letter-spacing:.3px}
.hero h1{font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1.1;margin-bottom:12px}
.hero h1 span{background:linear-gradient(135deg,#ef4444 0%,#f97316 50%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:15px;color:var(--muted);font-weight:300}

/* CATEGORY */
.cat{margin-bottom:36px}
.cat-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.cat-cnt{font-size:11px;color:var(--muted);background:var(--sur2);padding:2px 8px;border-radius:20px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:13px;padding:18px 12px 14px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;position:relative;overflow:hidden;animation:fadeUp .3s ease both}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-c,#6366f1);transform:scaleX(0);transition:transform .2s;transform-origin:left}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--card-c,#6366f1) 35%,transparent)}
.card:hover::before{transform:scaleX(1)}
.card-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;background:var(--icon-bg)}
.card-name{font-size:12.5px;font-weight:600;color:var(--txt);line-height:1.3}
.card-desc{font-size:10.5px;color:var(--muted);margin-top:-3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* OVERLAY */
.ovr{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.ovr.open{display:flex}
.modal{background:var(--sur);border-radius:18px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.mod-hd{padding:22px 26px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--sur);z-index:2;border-radius:18px 18px 0 0}
.mod-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mod-info{flex:1}
.mod-title{font-size:18px;font-weight:700}
.mod-sub{font-size:12px;color:var(--muted);margin-top:2px}
.mod-close{background:var(--sur2);border:1px solid var(--bdr);border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);flex-shrink:0;transition:all .15s}
.mod-close:hover{background:var(--sur3);color:var(--txt)}
.mod-bd{padding:22px 26px 26px}

/* DROPZONE */
.dz{border:2px dashed var(--bdr);border-radius:13px;padding:38px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--sur2)}
.dz:hover,.dz.over{border-color:var(--acc);background:rgba(99,102,241,.04)}
.dz-ico{font-size:36px;margin-bottom:10px}
.dz h3{font-size:14px;font-weight:600;margin-bottom:4px}
.dz p{font-size:11.5px;color:var(--muted)}
.dz .lnk{color:var(--acc);font-weight:500}

/* FILE CHIPS */
.chips{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.chip{background:var(--sur2);border:1px solid var(--bdr);border-radius:9px;padding:10px 13px;display:flex;align-items:center;gap:9px}
.chip-ico{font-size:18px}
.chip-name{flex:1;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-sz{font-size:10.5px;color:var(--muted);white-space:nowrap}
.chip-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:3px;border-radius:4px;line-height:1;transition:color .15s}
.chip-del:hover{color:#ef4444}

/* OPTS */
.osec{margin-top:18px}
.olbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:9px;display:block}
.orow{display:flex;flex-wrap:wrap;gap:7px}
.opill{background:var(--sur2);border:2px solid var(--bdr);border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--txt);transition:all .15s}
.opill:hover{border-color:var(--acc);color:var(--acc)}
.opill.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.fg{display:flex;flex-direction:column;gap:5px}
.frow{display:grid;gap:10px}
.frow.c2{grid-template-columns:1fr 1fr}
.frow.c3{grid-template-columns:1fr 1fr 1fr}
.fc{background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
.fc:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
textarea.fc{resize:vertical;min-height:80px}

/* PAGE THUMBS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;margin-top:14px;max-height:340px;overflow-y:auto;padding:3px}
.pitem{background:var(--sur2);border:2px solid var(--bdr);border-radius:9px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;user-select:none}
.pitem:hover{border-color:var(--acc);transform:scale(1.02)}
.pitem.sel{border-color:var(--acc)}
.pitem.sel::after{content:'✓';position:absolute;top:4px;right:4px;background:var(--acc);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:18px;text-align:center}
.pitem canvas,.pitem img{width:100%;display:block}
.pnum{text-align:center;font-size:10px;color:var(--muted);padding:3px;background:var(--sur)}
.pitem[draggable="true"]{cursor:grab}
.pitem.drag-over{border-color:#f97316;background:rgba(249,115,22,.06)}

/* BUTTONS */
.abar{margin-top:22px;display:flex;gap:9px;flex-wrap:wrap}
.btn{border-radius:9px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.btn-p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.3)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(99,102,241,.4)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-g{background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2)}
.btn-g:hover{background:var(--sur3)}
.btn-d{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3)}
.btn-d:hover{transform:translateY(-1px)}

/* PROGRESS */
.prg-w{margin-top:14px;display:none}
.prg-w.show{display:block}
.prg-bar{background:var(--sur3);border-radius:100px;height:5px;overflow:hidden}
.prg-fill{height:100%;background:linear-gradient(90deg,#6366f1,#06b6d4);border-radius:100px;transition:width .3s}
.prg-lbl{font-size:11.5px;color:var(--muted);margin-top:5px;text-align:center}

/* RESULT */
.res{margin-top:16px;background:var(--sur2);border-radius:11px;padding:16px;display:none}
.res.show{display:block}
.res-title{font-size:13px;font-weight:600;margin-bottom:10px}

/* VIEWER */
#viewerCanvas{border-radius:8px;box-shadow:var(--shadow);display:block;margin:0 auto;max-width:100%}
.vc{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0}
.vinfo{font-size:12px;color:var(--muted);min-width:70px;text-align:center}

/* COMPARE */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cpanel{text-align:center}
.cpanel canvas{width:100%;border-radius:8px;box-shadow:var(--shadow)}

/* INFO TABLE */
.itbl{width:100%;border-collapse:collapse}
.itbl tr td{padding:9px 11px;border-bottom:1px solid var(--bdr);font-size:12.5px}
.itbl tr td:first-child{color:var(--muted);font-weight:500;width:42%}
.itbl tr:last-child td{border-bottom:none}

/* SIG */
#sigCanvas{border:2px solid var(--bdr);border-radius:11px;cursor:crosshair;touch-action:none;background:#fff;width:100%;display:block}

/* REDACT */
.redact-wrap{position:relative;margin-top:12px}
#redactCanvas{width:100%;border-radius:8px;display:block}
#redactOvr{position:absolute;top:0;left:0;width:100%;cursor:crosshair;border-radius:8px;display:block}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#059669}
#toast.err{background:#dc2626}
#toast.inf{background:#2563eb}

/* NO RESULTS */
.nores{text-align:center;padding:50px 20px;color:var(--muted);display:none}
.nores.show{display:block}
.nores-ico{font-size:44px;margin-bottom:10px}

/* MISC */
.divider{height:1px;background:var(--bdr);margin:16px 0}
.helper{font-size:11px;color:var(--muted);margin-top:4px}
.rrow{display:flex;align-items:center;gap:10px}
.rval{font-size:13px;font-weight:600;color:var(--acc);min-width:38px;text-align:right}
input[type="range"]{accent-color:var(--acc)}
input[type="color"]{height:38px;border:none;border-radius:7px;cursor:pointer;padding:2px;background:var(--sur2);width:50px}
.sel-info{font-size:11px;color:var(--muted);margin-top:8px}
.mt2{margin-top:8px}
.mt3{margin-top:12px}
.mt4{margin-top:16px}

/* RESPONSIVE */
@media(max-width:640px){
  .hdr{padding:0 14px}
  .main{padding:18px 14px 60px}
  .hero h1{font-size:26px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
  .srch{display:none}
  .mod-bd{padding:16px}
  .cgrid{grid-template-columns:1fr}
  .frow.c3{grid-template-columns:1fr 1fr}
  .frow.c2{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo">
    <div class="logo-mark">🏭</div>
    <div>
      <div class="logo-name">The PDF Factory</div>
      <div class="logo-by">by Smit Parekh</div>
    </div>
  </div>
  <div class="srch">
    <span class="srch-icon">🔍</span>
    <input id="searchInput" type="text" placeholder="Search 40 PDF tools…">
  </div>
  <div class="hdr-r">
    <button class="pbtn" onclick="toggleTheme()">
      <span id="themeIco">🌙</span><span id="themeLbl">Dark Mode</span>
    </button>
  </div>
</header>

<!-- MAIN -->
<div class="main">
  <div class="hero">
    <div class="hero-badge">⚡ 40 Tools &nbsp;·&nbsp; 100% Offline &nbsp;·&nbsp; No Upload Required</div>
    <h1>Every PDF Task.<br><span>Done in Seconds.</span></h1>
    <p>No servers. No internet. Everything runs locally in your browser — free forever.</p>
  </div>
  <div id="sections"></div>
  <div class="nores" id="nores">
    <div class="nores-ico">🔍</div>
    <p>No tools match "<span id="noresQ"></span>"</p>
  </div>
</div>

<!-- MODAL -->
<div class="ovr" id="ovr" onclick="ovrClick(event)">
  <div class="modal" id="modal">
    <div class="mod-hd" id="modHd"></div>
    <div class="mod-bd" id="modBd"></div>
  </div>
</div>

<div id="toast"></div>

<!-- HIDDEN INPUTS -->
<input type="file" id="fMulti" accept="application/pdf" multiple>
<input type="file" id="fSingle" accept="application/pdf">
<input type="file" id="fImg" accept="image/*" multiple>

<script>
// ── PDF.js worker ────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── TOOLS DATA ────────────────────────────────────────────────────
const TOOLS=[
  // ORGANIZE
  {id:'merge',   name:'Merge PDF',      desc:'Combine multiple PDFs',   icon:'🔀',c:'#ef4444',bg:'rgba(239,68,68,.1)',   cat:'Organize'},
  {id:'split',   name:'Split PDF',      desc:'Split into parts',        icon:'✂️',c:'#f97316',bg:'rgba(249,115,22,.1)',  cat:'Organize'},
  {id:'extract', name:'Extract Pages',  desc:'Pick pages to keep',      icon:'📤',c:'#f59e0b',bg:'rgba(245,158,11,.1)',  cat:'Organize'},
  {id:'delete',  name:'Delete Pages',   desc:'Remove specific pages',   icon:'🗑️',c:'#ef4444',bg:'rgba(239,68,68,.1)',   cat:'Organize'},
  {id:'reorder', name:'Reorder Pages',  desc:'Drag & drop to rearrange',icon:'↕️',c:'#f97316',bg:'rgba(249,115,22,.1)',  cat:'Organize'},
  {id:'rotate',  name:'Rotate PDF',     desc:'Rotate pages',            icon:'🔄',c:'#a855f7',bg:'rgba(168,85,247,.1)',  cat:'Organize'},
  {id:'crop',    name:'Crop PDF',       desc:'Trim page margins',       icon:'⬜',c:'#ec4899',bg:'rgba(236,72,153,.1)',  cat:'Organize'},
  {id:'resize',  name:'Resize Pages',   desc:'A4, Letter, custom…',     icon:'📐',c:'#8b5cf6',bg:'rgba(139,92,246,.1)',  cat:'Organize'},
  // CONVERT
  {id:'p2img',   name:'PDF to Image',   desc:'Export as PNG or JPEG',   icon:'🖼️',c:'#f97316',bg:'rgba(249,115,22,.1)',  cat:'Convert'},
  {id:'i2pdf',   name:'Image to PDF',   desc:'JPG, PNG → PDF',          icon:'📷',c:'#f59e0b',bg:'rgba(245,158,11,.1)',  cat:'Convert'},
  {id:'p2txt',   name:'PDF to Text',    desc:'Extract all text',        icon:'📝',c:'#10b981',bg:'rgba(16,185,129,.1)',  cat:'Convert'},
  {id:'p2word',  name:'PDF to Word',    desc:'Export as .doc',          icon:'📄',c:'#3b82f6',bg:'rgba(59,130,246,.1)',  cat:'Convert'},
  {id:'p2csv',   name:'PDF to Excel',   desc:'Extract tables as CSV',   icon:'📊',c:'#22c55e',bg:'rgba(34,197,94,.1)',   cat:'Convert'},
  {id:'html2p',  name:'HTML to PDF',    desc:'Paste HTML, print to PDF',icon:'🌐',c:'#6366f1',bg:'rgba(99,102,241,.1)',  cat:'Convert'},
  {id:'pdfa',    name:'PDF/A',          desc:'Archival standard format',icon:'🏛️',c:'#0ea5e9',bg:'rgba(14,165,233,.1)',  cat:'Convert'},
  // OPTIMIZE
  {id:'comp',    name:'Compress PDF',   desc:'Reduce file size',        icon:'🗜️',c:'#14b8a6',bg:'rgba(20,184,166,.1)',  cat:'Optimize'},
  {id:'repair',  name:'Repair PDF',     desc:'Fix corrupt files',       icon:'🔧',c:'#22c55e',bg:'rgba(34,197,94,.1)',   cat:'Optimize'},
  {id:'gray',    name:'Grayscale PDF',  desc:'Remove all color',        icon:'🌫️',c:'#6b7280',bg:'rgba(107,114,128,.1)', cat:'Optimize'},
  {id:'flat',    name:'Flatten Forms',  desc:'Lock interactive fields', icon:'📋',c:'#64748b',bg:'rgba(100,116,139,.1)', cat:'Optimize'},
  {id:'webopt',  name:'Web Optimize',   desc:'Faster online loading',   icon:'⚡',c:'#f59e0b',bg:'rgba(245,158,11,.1)',  cat:'Optimize'},
  // SECURITY
  {id:'protect', name:'Protect PDF',    desc:'Password lock',           icon:'🔒',c:'#3b82f6',bg:'rgba(59,130,246,.1)',  cat:'Security'},
  {id:'unlock',  name:'Unlock PDF',     desc:'Remove restrictions',     icon:'🔓',c:'#6366f1',bg:'rgba(99,102,241,.1)',  cat:'Security'},
  {id:'redact',  name:'Redact PDF',     desc:'Black out content',       icon:'⬛',c:'#111827',bg:'rgba(17,24,39,.15)',   cat:'Security'},
  {id:'sign',    name:'Sign PDF',       desc:'Draw your signature',     icon:'✍️',c:'#0ea5e9',bg:'rgba(14,165,233,.1)',  cat:'Security'},
  {id:'certify', name:'Certify PDF',    desc:'Certify & timestamp',     icon:'🎖️',c:'#14b8a6',bg:'rgba(20,184,166,.1)',  cat:'Security'},
  // ENHANCE
  {id:'wmark',   name:'Watermark',      desc:'Stamp text on pages',     icon:'💧',c:'#06b6d4',bg:'rgba(6,182,212,.1)',   cat:'Enhance'},

// ── RENDER TOOL GRID ──────────────────────────────────────────────
function renderGrid(q=''){
  const sec=document.getElementById('sections');
  const nr=document.getElementById('nores');
  const lq=q.toLowerCase();
  let any=false,html='';
  CATS.forEach(cat=>{
    const tls=TOOLS.filter(t=>t.cat===cat&&(!lq||t.name.toLowerCase().includes(lq)||t.desc.toLowerCase().includes(lq)));
    if(!tls.length)return;
    any=true;
    html+=`<div class="cat"><div class="cat-hdr"><div class="cat-dot" style="background:${CATC[cat]}"></div><span class="cat-lbl">${cat}</span><span class="cat-cnt">${tls.length}</span></div><div class="grid">${tls.map((t,i)=>`<div class="card" style="--card-c:${t.c};--icon-bg:${t.bg};animation-delay:${i*25}ms" onclick="openTool('${t.id}')"><div class="card-icon">${t.icon}</div><div><div class="card-name">${t.name}</div><div class="card-desc">${t.desc}</div></div></div>`).join('')}</div></div>`;
  });
  sec.innerHTML=html;
  nr.classList.toggle('show',!any);
  if(!any)document.getElementById('noresQ').textContent=q;
}

// ── THEME ─────────────────────────────────────────────────────────
function toggleTheme(){
  const d=document.documentElement;
  const dk=d.dataset.theme==='dark';
  d.dataset.theme=dk?'light':'dark';
  document.getElementById('themeIco').textContent=dk?'🌙':'☀️';
  document.getElementById('themeLbl').textContent=dk?'Dark Mode':'Light Mode';
  localStorage.setItem('pf-theme',dk?'light':'dark');
}
function initTheme(){
  const t=localStorage.getItem('pf-theme')||'light';
  document.documentElement.dataset.theme=t;
  document.getElementById('themeIco').textContent=t==='dark'?'☀️':'🌙';
  document.getElementById('themeLbl').textContent=t==='dark'?'Light Mode':'Dark Mode';
}

// ── TOAST ─────────────────────────────────────────────────────────
function toast(msg,type='',dur=3200){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`show ${type}`;
  clearTimeout(el._t); el._t=setTimeout(()=>el.className='',dur);
}

// ── MODAL ─────────────────────────────────────────────────────────
function openTool(id){
  const t=TOOLS.find(x=>x.id===id); if(!t)return;
  curTool=t; files=[]; selPages=new Set(); thumbs=[]; reorderOrd=[]; bmList=[]; annotList=[]; redRects=[];
  document.getElementById('modHd').innerHTML=`<div class="mod-ico" style="background:${t.bg}">${t.icon}</div><div class="mod-info"><div class="mod-title">${t.name}</div><div class="mod-sub">${t.desc}</div></div><button class="mod-close" onclick="closeModal()">✕</button>`;
  document.getElementById('modBd').innerHTML=getUI(id);
  document.getElementById('ovr').classList.add('open');
  afterOpen(id);
}
function closeModal(){document.getElementById('ovr').classList.remove('open');curTool=null;pdfJsDoc=null}

// ── POST-OPEN INIT ────────────────────────────────────────────────
function afterOpen(id){
  // Setup dropzone
  const dz=document.getElementById('dz');
  if(dz){
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');handleDrop([...e.dataTransfer.files],id)});
  }
  // File inputs
  const fm=document.getElementById('fMulti'); if(fm)fm.onchange=e=>handleDrop([...e.target.files],id);
  const fs=document.getElementById('fSingle'); if(fs)fs.onchange=e=>handleDrop([...e.target.files],id);
  const fi=document.getElementById('fImg'); if(fi)fi.onchange=e=>handleImgFiles([...e.target.files]);
  // Compare inputs
  const c1=document.getElementById('cmp1'); if(c1)c1.onchange=e=>{cmp1=e.target.files[0];document.getElementById('cmp1lbl').innerHTML=`📄 <strong>${cmp1.name}</strong>`};
  const c2=document.getElementById('cmp2'); if(c2)c2.onchange=e=>{cmp2=e.target.files[0];document.getElementById('cmp2lbl').innerHTML=`📄 <strong>${cmp2.name}</strong>`};
  // Signature
  if(id==='sign')setTimeout(initSig,80);
}

// ── FILE HANDLING ─────────────────────────────────────────────────
async function handleDrop(fls,id){
  const pdfs=fls.filter(f=>f.type==='application/pdf'||f.name.endsWith('.pdf'));
  if(!pdfs.length){toast('Please upload PDF files','err');return}
  if(['merge','port'].includes(id))files.push(...pdfs); else files=[pdfs[0]];
  renderChips();
  const rb=document.getElementById('runBtn'); if(rb)rb.disabled=false;
  // Page tools
  if(['extract','delete','reorder'].includes(id))await loadThumbs(files[0],id);
  if(id==='meta')await loadMeta(files[0]);
  if(id==='viewer')await initViewer(files[0]);
  if(id==='sign'){document.getElementById('signArea').style.display='block';setTimeout(initSig,80)}
  if(id==='bookmark'){document.getElementById('bmArea').style.display='block'}
  if(id==='annot'){document.getElementById('annotArea').style.display='block'}
  if(id==='redact'){document.getElementById('redactArea').style.display='block';await loadRedactPg()}
  if(id==='info')await showInfo(files[0]);
}
function handleImgFiles(fls){
  files.push(...fls.filter(f=>f.type.startsWith('image/')));
  renderChips(true);
  const rb=document.getElementById('runBtn'); if(rb)rb.disabled=false;
}
function renderChips(img=false){
  const el=document.getElementById('chips'); if(!el)return;
  el.innerHTML=files.map((f,i)=>`<div class="chip"><span class="chip-ico">${img?'🖼️':'📄'}</span><span class="chip-name">${f.name}</span><span class="chip-sz">${fmtSz(f.size)}</span><button class="chip-del" onclick="rmFile(${i})">✕</button></div>`).join('');
}
function rmFile(i){files.splice(i,1);renderChips();if(!files.length){const rb=document.getElementById('runBtn');if(rb)rb.disabled=true}}
function clrFiles(){files=[];renderChips();const rb=document.getElementById('runBtn');if(rb)rb.disabled=true}
function fmtSz(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16)/255,g:parseInt(h.slice(3,5),16)/255,b:parseInt(h.slice(5,7),16)/255}}

function showPrg(lbl='Processing…'){const w=document.getElementById('pgW');if(w)w.classList.add('show');setPrg(0,lbl)}
function setPrg(p,l){const f=document.getElementById('pgF');const lb=document.getElementById('pgL');if(f)f.style.width=p+'%';if(lb&&l)lb.textContent=l}
function hidePrg(){const w=document.getElementById('pgW');if(w)w.classList.remove('show')}
function setRes(html){const r=document.getElementById('resBox');if(r){r.innerHTML=html;r.classList.add('show')}}

function savePdf(bytes,name='output.pdf'){saveAs(new Blob([bytes],{type:'application/pdf'}),name);toast(`✅ ${name} saved!`,'ok')}

// ── PAGE RANGE PARSE ──────────────────────────────────────────────
function parsePgRng(str,tot){
  const s=new Set();
  str.split(',').forEach(p=>{p=p.trim();if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=Math.min(b,tot);i++)s.add(i)}else{const n=parseInt(p);if(n>=1&&n<=tot)s.add(n)}});
  return[...s].sort((a,b)=>a-b);
}

function namedRgb(n){const m={black:[0,0,0],red:[.85,.1,.1],blue:[.1,.3,.9],green:[.1,.6,.1],gray:[.5,.5,.5]};return PDFLib.rgb(...(m[n]||m.black))}

// ── THUMBNAIL LOADER ──────────────────────────────────────────────
async function loadThumbs(file,id){
  const grid=document.getElementById('pgGrid'); if(!grid)return;
  grid.innerHTML='<p class="helper">Loading pages…</p>';
  showPrg('Rendering thumbnails…');
  try{
    const bytes=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
    pdfJsDoc=pdf; totPg=pdf.numPages;
    reorderOrd=Array.from({length:totPg},(_,i)=>i+1);
    grid.innerHTML='';
    for(let i=1;i<=totPg;i++){
      const page=await pdf.getPage(i);
      const vp=page.getViewport({scale:.28});
      const cv=document.createElement('canvas');
      cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      thumbs.push({cv,num:i});
      const item=document.createElement('div');
      item.className='pitem'; item.dataset.page=i;
      const numEl=document.createElement('div'); numEl.className='pnum'; numEl.textContent='Page '+i;
      item.appendChild(cv); item.appendChild(numEl);
      if(id==='reorder'){item.draggable=true;item.dataset.idx=i-1;setupDrag(item)}
      else item.onclick=()=>toggleSel(item,i);
      grid.appendChild(item);
      setPrg(Math.round(i/totPg*100),`Page ${i} of ${totPg}…`);
    }
    hidePrg();
    const si=document.getElementById('selInfo'); if(si)si.textContent=totPg+' pages loaded — click to select';
  }catch(e){grid.innerHTML=`<p class="helper" style="color:#ef4444">Error: ${e.message}</p>`;hidePrg()}
}

function toggleSel(el,n){
  if(selPages.has(n)){selPages.delete(n);el.classList.remove('sel')}
  else{selPages.add(n);el.classList.add('sel')}
  const si=document.getElementById('selInfo'); if(si)si.textContent=selPages.size+' page(s) selected';
}

// ── DRAG FOR REORDER ──────────────────────────────────────────────
let dragSrc=null;
function setupDrag(el){
  el.addEventListener('dragstart',e=>{dragSrc=el;e.dataTransfer.effectAllowed='move';el.style.opacity='.4'});
  el.addEventListener('dragend',()=>el.style.opacity='1');
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
  el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drag-over');
    if(dragSrc&&dragSrc!==el){
      const g=document.getElementById('pgGrid'),items=[...g.children];
      const si=items.indexOf(dragSrc),di=items.indexOf(el);
      if(si<di)g.insertBefore(dragSrc,el.nextSibling); else g.insertBefore(dragSrc,el);
      updReorder();
    }
  });
}
function updReorder(){const g=document.getElementById('pgGrid');reorderOrd=[...g.children].map(el=>+el.dataset.page)}

// ── VIEWER ────────────────────────────────────────────────────────
async function initViewer(file){
  document.getElementById('viewArea').style.display='block';
  const bytes=await file.arrayBuffer();
  pdfJsDoc=await pdfjsLib.getDocument({data:bytes}).promise;
  totPg=pdfJsDoc.numPages; curPg=1;
  await renderViewPg();
}
async function renderViewPg(){
  if(!pdfJsDoc)return;
  const pg=await pdfJsDoc.getPage(curPg);
  const vp=pg.getViewport({scale:viewScale});
  const cv=document.getElementById('viewerCanvas');
  cv.width=vp.width; cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  document.getElementById('vInfo').textContent=`${curPg} / ${totPg}`;
}
async function vPrev(){if(curPg>1){curPg--;await renderViewPg()}}
async function vNext(){if(curPg<totPg){curPg++;await renderViewPg()}}
async function vZI(){viewScale=Math.min(viewScale+.25,4);await renderViewPg()}
async function vZO(){viewScale=Math.max(viewScale-.25,.5);await renderViewPg()}

// ── PDF INFO ──────────────────────────────────────────────────────
async function showInfo(file){
  try{
    const bytes=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
    const m=await pdf.getMetadata().catch(()=>({}));
    const info=m.info||{};
    document.getElementById('infoArea').style.display='block';
    const rows=[['File Name',file.name],['File Size',fmtSz(file.size)],['Pages',pdf.numPages],['Title',info.Title||'—'],['Author',info.Author||'—'],['Subject',info.Subject||'—'],['Keywords',info.Keywords||'—'],['Creator',info.Creator||'—'],['Producer',info.Producer||'—'],['PDF Version',info.PDFFormatVersion||'—'],['Encrypted',m.encrypted?'Yes ⚠️':'No']];
    document.getElementById('itbl').innerHTML=rows.map(([k,v])=>`<tr><td>${k}</td><td><strong>${v}</strong></td></tr>`).join('');
  }catch(e){toast('Could not read PDF info','err')}
}

// ── LOAD METADATA ─────────────────────────────────────────────────
async function loadMeta(file){
  try{
    const bytes=await file.arrayBuffer();
    const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
    document.getElementById('metaArea').style.display='block';
    document.getElementById('mTitle').value=doc.getTitle()||'';
    document.getElementById('mAuth').value=doc.getAuthor()||'';
    document.getElementById('mSubj').value=doc.getSubject()||'';
    document.getElementById('mKws').value=(doc.getKeywords()||[]).join(', ');
    document.getElementById('mCre').value=doc.getCreator()||'';
  }catch(e){}
}

// ── SIGNATURE ─────────────────────────────────────────────────────
function initSig(){
  const cv=document.getElementById('sigCanvas'); if(!cv)return;
  cv.width=cv.offsetWidth||700; cv.height=180;
  const ctx=cv.getContext('2d');
  ctx.strokeStyle=sigColor; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round';
  const pos=e=>{const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}};
  let lx=0,ly=0;
  cv.onmousedown=cv.ontouchstart=e=>{e.preventDefault();sigDrawing=true;const p=pos(e);lx=p.x;ly=p.y;ctx.strokeStyle=sigColor};
  cv.onmousemove=cv.ontouchmove=e=>{e.preventDefault();if(!sigDrawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y};
  cv.onmouseup=cv.ontouchend=()=>sigDrawing=false;
  cv.onmouseleave=()=>sigDrawing=false;
}
function clrSig(){const cv=document.getElementById('sigCanvas');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height)}

// ── REDACT ────────────────────────────────────────────────────────
async function loadRedactPg(){
  const pn=parseInt(document.getElementById('redPgN')?.value||1);
  if(!files[0])return;
  const bytes=await files[0].arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  const pg=await pdf.getPage(pn);
  const vp=pg.getViewport({scale:1.4});
  const cv=document.getElementById('redactCanvas');
  const ov=document.getElementById('redactOvr');
  if(!cv||!ov)return;
  cv.width=vp.width; cv.height=vp.height;
  ov.width=vp.width; ov.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  redRects=[];
  const pos=e=>{const r=ov.getBoundingClientRect(),sx=ov.width/r.width,sy=ov.height/r.height;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}};
  ov.onmousedown=e=>{const p=pos(e);redStartX=p.x;redStartY=p.y;redDrawing=true};
  ov.onmousemove=e=>{if(!redDrawing)return;const p=pos(e),ctx=ov.getContext('2d');ctx.clearRect(0,0,ov.width,ov.height);redRects.forEach(r=>{ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(r.x,r.y,r.w,r.h)});ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(redStartX,redStartY,p.x-redStartX,p.y-redStartY)};
  ov.onmouseup=e=>{if(!redDrawing)return;redDrawing=false;const p=pos(e);const rect={x:Math.min(redStartX,p.x),y:Math.min(redStartY,p.y),w:Math.abs(p.x-redStartX),h:Math.abs(p.y-redStartY)};redRects.push(rect);const ctx=ov.getContext('2d');ctx.clearRect(0,0,ov.width,ov.height);redRects.forEach(r=>{ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(r.x,r.y,r.w,r.h)})};

async function doMerge(){
  setPrg(10,'Loading PDFs…');
  const out=await PDFLib.PDFDocument.create();
  const addBlank=document.getElementById('mergeBlank')?.value==='1';
  for(let i=0;i<files.length;i++){
    const bytes=await files[i].arrayBuffer();
    const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
    const pgs=await out.copyPages(doc,doc.getPageIndices());
    pgs.forEach(p=>out.addPage(p));
    if(addBlank&&i<files.length-1)out.addPage();
    setPrg(10+((i+1)/files.length)*80,`Merged ${i+1}/${files.length}…`);
  }
  setPrg(95,'Saving…');
  const name=document.getElementById('mergeOut')?.value||'merged.pdf';
  savePdf(await out.save(),name);
}

async function doSplit(){
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const tot=doc.getPageCount();
  const zip=new JSZip();
  const base=files[0].name.replace(/\.pdf$/i,'');
  setPrg(10,'Splitting…');
  if(splitMode==='each'){
    for(let i=0;i<tot;i++){const o=await PDFLib.PDFDocument.create();const[p]=await o.copyPages(doc,[i]);o.addPage(p);zip.file(`${base}_p${i+1}.pdf`,await o.save());setPrg(10+((i+1)/tot)*80,`Page ${i+1}/${tot}…`)}
  }else if(splitMode==='range'){
    const parts=(document.getElementById('sRng')?.value||'').split(',');
    for(let i=0;i<parts.length;i++){const pgs=parsePgRng(parts[i].trim(),tot);if(!pgs.length)continue;const o=await PDFLib.PDFDocument.create();const cp=await o.copyPages(doc,pgs.map(p=>p-1));cp.forEach(p=>o.addPage(p));zip.file(`${base}_part${i+1}.pdf`,await o.save());setPrg(10+((i+1)/parts.length)*80)}
  }else{
    const n=parseInt(document.getElementById('chunkN')?.value||2);let pt=1;
    for(let i=0;i<tot;i+=n){const idx=[];for(let j=i;j<Math.min(i+n,tot);j++)idx.push(j);const o=await PDFLib.PDFDocument.create();const cp=await o.copyPages(doc,idx);cp.forEach(p=>o.addPage(p));zip.file(`${base}_part${pt++}.pdf`,await o.save());setPrg(10+(i/tot)*80)}
  }
  setPrg(96,'Zipping…');
  saveAs(await zip.generateAsync({type:'blob'}),`${base}_split.zip`);
  toast('✅ Split complete! ZIP saved.','ok');
}

async function doI2Pdf(){
  const doc=await PDFLib.PDFDocument.create();
  const[pw,ph]=pgSz==='fit'?[0,0]:getDims(pgSz);
  for(let i=0;i<files.length;i++){
    const file=files[i];
    const ab=await file.arrayBuffer();
    const u8=new Uint8Array(ab);
    let img;
    try{img=file.type==='image/png'?await doc.embedPng(u8):await doc.embedJpg(u8)}
    catch{
      const cv=document.createElement('canvas');const ctx=cv.getContext('2d');
      const url=URL.createObjectURL(file);
      const im=await new Promise(r=>{const x=new Image();x.onload=()=>r(x);x.src=url});
      cv.width=im.naturalWidth;cv.height=im.naturalHeight;ctx.drawImage(im,0,0);URL.revokeObjectURL(url);
      const jb=await fetch(cv.toDataURL('image/jpeg',.92)).then(r=>r.arrayBuffer());
      img=await doc.embedJpg(new Uint8Array(jb));
    }
    const{width:iw,height:ih}=img;
    let pageW=pw||iw,pageH=ph||ih;
    const page=doc.addPage([pageW,pageH]);
    if(pw&&ph){const sc=Math.min(pw/iw,ph/ih);const dw=iw*sc,dh=ih*sc;page.drawImage(img,{x:(pw-dw)/2,y:(ph-dh)/2,width:dw,height:dh})}
    else page.drawImage(img,{x:0,y:0,width:iw,height:ih});
    setPrg(10+((i+1)/files.length)*80);
  }
  savePdf(await doc.save(),'images.pdf');
}

async function doP2Csv(){

    const rows={};c.items.forEach(item=>{const y=Math.round(item.transform[5]);if(!rows[y])rows[y]=[];rows[y].push(`"${item.str.replace(/"/g,'""')}"`)});
    Object.keys(rows).sort((a,b)=>b-a).forEach(y=>csv+=rows[y].join(',')+'\n');
    csv+='\n';setPrg(10+(i/tot)*80);

    ctx.putImageData(id,0,0);
    const jd=await fetch(cv.toDataURL('image/jpeg',.92)).then(r=>r.arrayBuffer());
    const img=await newDoc.embedJpg(new Uint8Array(jd));
    const{width:ow,height:oh}=pg.getViewport({scale:1});

    np.drawImage(img,{x:0,y:0,width:ow,height:oh});

  const x=+document.getElementById('sigX').value||50,y=+document.getElementById('sigY').value||50;
  const w=+document.getElementById('sigW').value||200,h=+document.getElementById('sigH').value||60;
  const pngAb=await fetch(cv.toDataURL('image/png')).then(r=>r.arrayBuffer());
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const img=await doc.embedPng(new Uint8Array(pngAb));
  doc.getPage(Math.min(pg,doc.getPageCount())-1).drawImage(img,{x,y,width:w,height:h});
  setPrg(90,'Embedding…'); savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_signed.pdf');
}

async function doCertify(){
  const by=document.getElementById('cBy')?.value||'Unknown';
  const org=document.getElementById('cOrg')?.value||'';
  const note=document.getElementById('cNote')?.value||'';
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  doc.setAuthor(by);if(org)doc.setCreator(org);if(note)doc.setSubject('Certified: '+note);
  doc.setKeywords(['certified','authenticated',new Date().toISOString()]);
  const pg=doc.getPage(0);const{width:pw,height:ph}=pg.getSize();
  const fn=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  pg.drawText(`Certified by ${by}${org?' · '+org:''} · ${new Date().toLocaleDateString()}`,{x:30,y:18,size:8,font:fn,color:PDFLib.rgb(.5,.5,.5)});
  setPrg(90,'Saving…'); savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_certified.pdf');
}

async function doWmark(){
  const txt=document.getElementById('wmTxt')?.value?.trim()||'WATERMARK';
  const sz=+document.getElementById('wmSz').value||60;
  const op=+document.getElementById('wmOp').value/100||.25;
  const ang=+document.getElementById('wmAng').value||45;
  const col=document.getElementById('wmCol')?.value||'gray';
  const pos=document.getElementById('wmPos')?.value||'center';
  const colorMap={gray:PDFLib.rgb(.5,.5,.5),red:PDFLib.rgb(.8,.1,.1),blue:PDFLib.rgb(.1,.3,.85),green:PDFLib.rgb(.1,.6,.1)};
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const fn=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const pgs=doc.getPages();
  pgs.forEach((pg,i)=>{
    const{width:pw,height:ph}=pg.getSize();
    const tw=fn.widthOfTextAtSize(txt,sz);
    const cy=pos==='top'?ph-80:pos==='bottom'?80:ph/2;
    pg.drawText(txt,{x:(pw-tw)/2,y:cy,size:sz,font:fn,color:colorMap[col]||colorMap.gray,opacity:op,rotate:PDFLib.degrees(ang)});
    setPrg(10+((i+1)/pgs.length)*80);
  });
  savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_wm.pdf');
}

async function doHF(){
  const hTxt=document.getElementById('hTxt')?.value||'';
  const fTxt=document.getElementById('fTxt')?.value||'';
  if(!hTxt&&!fTxt){toast('Enter header or footer text','err');return}
  const sz=+document.getElementById('hfSz').value||10;
  const al=document.getElementById('hfAl')?.value||'Center';
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const fn=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const pgs=doc.getPages();const tot=pgs.length;const today=new Date().toLocaleDateString();
  pgs.forEach((pg,i)=>{
    const{width:pw,height:ph}=pg.getSize();const pn=i+1;
    const rv=t=>t.replace(/\{page\}/g,pn).replace(/\{total\}/g,tot).replace(/\{date\}/g,today);
    const gx=(t,s)=>{const tw=fn.widthOfTextAtSize(t,s);return al==='Left'?30:al==='Right'?pw-tw-30:(pw-tw)/2};
    if(hTxt){const h=rv(hTxt);pg.drawText(h,{x:gx(h,sz),y:ph-18,size:sz,font:fn,color:PDFLib.rgb(.3,.3,.3)})}
    if(fTxt){const f=rv(fTxt);pg.drawText(f,{x:gx(f,sz),y:12,size:sz,font:fn,color:PDFLib.rgb(.3,.3,.3)})}
    setPrg(10+((i+1)/tot)*80);
  });
  savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_hf.pdf');
}

async function doPgNum(){
  const posStr=document.getElementById('pnPos')?.value||'bottom-center';
  const start=parseInt(document.getElementById('pnStart')?.value||1);
  const fmt=document.getElementById('pnFmt')?.value||'{n}';
  const sz=+document.getElementById('pnSz').value||11;
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const fn=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const pgs=doc.getPages();
  pgs.forEach((pg,i)=>{
    const{width:pw,height:ph}=pg.getSize();const n=start+i,t=pgs.length;
    const lbl=fmt.replace(/\{n\}/g,n).replace(/\{t\}/g,t);
    const tw=fn.widthOfTextAtSize(lbl,sz);const[vert,hor]=posStr.split('-');
    const y=vert==='bottom'?14:ph-20;
    const x=hor==='center'?(pw-tw)/2:hor==='right'?pw-tw-24:24;
    pg.drawText(lbl,{x,y,size:sz,font:fn,color:PDFLib.rgb(.35,.35,.35)});
    setPrg(10+((i+1)/pgs.length)*80);
  });
  savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_paged.pdf');
}

async function doBates(){
  const pfx=document.getElementById('bPfx')?.value||'DOC-';
  const start=parseInt(document.getElementById('bStart')?.value||1);
  const pad=parseInt(document.getElementById('bPad')?.value||6);
  const posStr=document.getElementById('bPos')?.value||'bottom-right';
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const fn=await doc.embedFont(PDFLib.StandardFonts.CourierBold);
  const pgs=doc.getPages();
  pgs.forEach((pg,i)=>{
    const{width:pw,height:ph}=pg.getSize();const lbl=pfx+String(start+i).padStart(pad,'0');const tw=fn.widthOfTextAtSize(lbl,9);
    const[vert,hor]=posStr.split('-');const y=vert==='bottom'?11:ph-17;const x=hor==='right'?pw-tw-18:18;
    pg.drawText(lbl,{x,y,size:9,font:fn,color:PDFLib.rgb(.15,.15,.15)});
    setPrg(10+((i+1)/pgs.length)*80);
  });
  savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_bates.pdf');
}

async function doBm(){
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  if(bmList.length)doc.setKeywords(bmList.map(b=>b.t).join(', '));
  doc.setSubject(bmList.length?`Bookmarks: ${bmList.map(b=>b.t+' (p.'+b.p+')').join('; ')}`:'');
  setPrg(80,'Saving…'); savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_bm.pdf');
}

async function doAnnots(){
  if(!annotList.length){toast('Add at least one annotation','err');return}
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const fn=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const pgs=doc.getPages();
  const bgMap={none:null,yellow:[1,.95,.3],pink:[1,.7,.8],cyan:[.6,.95,1]};
  for(let i=0;i<annotList.length;i++){
    const a=annotList[i];const pg=pgs[Math.min(a.pg-1,pgs.length-1)];
    const tw=fn.widthOfTextAtSize(a.tx,a.sz);
    if(a.bg&&bgMap[a.bg]){const[r,g,b]=bgMap[a.bg];pg.drawRectangle({x:a.x-2,y:a.y-2,width:tw+4,height:a.sz+4,color:PDFLib.rgb(r,g,b),opacity:.65})}
    pg.drawText(a.tx,{x:a.x,y:a.y,size:a.sz,font:fn,color:namedRgb(a.col)});
    setPrg(10+((i+1)/annotList.length)*80);
  }
  savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_annot.pdf');
}

async function doMeta(){
  const bytes=await files[0].arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const g=id=>document.getElementById(id)?.value?.trim();
  if(g('mTitle'))doc.setTitle(g('mTitle'));
  if(g('mAuth'))doc.setAuthor(g('mAuth'));
  if(g('mSubj'))doc.setSubject(g('mSubj'));
  if(g('mKws'))doc.setKeywords([g('mKws')]);
  if(g('mCre'))doc.setCreator(g('mCre'));
  doc.setModificationDate(new Date());
  setPrg(80,'Saving…'); savePdf(await doc.save(),files[0].name.replace(/\.pdf$/i,'')+'_meta.pdf');
}

async function doBg(){
  const hex=document.getElementById('bgCol')?.value||'#ffffff';
  const op=+document.getElementById('bgOp').value/100||1;
  const{r,g,b}=hexToRgb(hex);
  setPrg(5,'Rendering pages with background…');
  const bytes=await files[0].arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  const tot=pdf.numPages;
  const newDoc=await PDFLib.PDFDocument.create();
  const bgR=Math.round(r*255),bgG=Math.round(g*255),bgB=Math.round(b*255);
  for(let i=1;i<=tot;i++){
    const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    const ctx=cv.getContext('2d');
    ctx.fillStyle=`rgba(${bgR},${bgG},${bgB},${op})`;ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    const jd=await fetch(cv.toDataURL('image/jpeg',.92)).then(x=>x.arrayBuffer());
    const img=await newDoc.embedJpg(new Uint8Array(jd));
    const{width:ow,height:oh}=pg.getViewport({scale:1});
    const np=newDoc.addPage([ow,oh]);np.drawImage(img,{x:0,y:0,width:ow,height:oh});
    setPrg(5+(i/tot)*85,`Page ${i}/${tot}…`);
  }
  savePdf(await newDoc.save(),files[0].name.replace(/\.pdf$/i,'')+'_bg.pdf');
}

async function doOcr(){
  setPrg(5,'Loading OCR engine…');
  if(typeof Tesseract==='undefined'){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  }
  const bytes=await files[0].arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  const tot=pdf.numPages;let txt='';
  for(let i=1;i<=tot;i++){
    const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2.5});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    setPrg(5+((i-.5)/tot)*85,`OCR page ${i}/${tot}…`);
    const{data}=await Tesseract.recognize(cv,ocrLang);
    txt+=`\n\n=== Page ${i} ===\n\n`+data.text;
    setPrg(5+(i/tot)*85,`Page ${i}/${tot} done`);
  }
  saveAs(new Blob([txt.trim()],{type:'text/plain'}),files[0].name.replace(/\.pdf$/i,'')+'_ocr.txt');
  toast('✅ OCR complete!','ok');
}

async function doPrint(){
  const bytes=await files[0].arrayBuffer();
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  const w=window.open(url,'_blank');if(w)setTimeout(()=>w.print(),800);
  setPrg(100,'Opening print dialog…');toast('PDF opened for printing','inf');
}

async function doXImgs(){
  const bytes=await files[0].arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  const tot=pdf.numPages;const zip=new JSZip();const base=files[0].name.replace(/\.pdf$/i,'');
  for(let i=1;i<=tot;i++){
    const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2.5});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    zip.file(`${base}_p${i}.png`,cv.toDataURL('image/png').split(',')[1],{base64:true});
    setPrg(10+(i/tot)*80,`Page ${i}/${tot}…`);
  }
  setPrg(95,'Zipping…');
  saveAs(await zip.generateAsync({type:'blob'}),`${base}_images.zip`);
  toast('✅ Images extracted to ZIP!','ok');
}

async function doNup(){
  const bytes=await files[0].arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  const tot=pdf.numPages;
  const[tw,th]=getDims(pgSz);
  const cols=nupN<=2?2:nupN<=4?2:3;
  const rows=Math.ceil(nupN/cols);
  const cw=tw/cols,ch=th/rows;
  const newDoc=await PDFLib.PDFDocument.create();
  let pi=0;
  while(pi<tot){
    const outPg=newDoc.addPage([tw,th]);
    for(let slot=0;slot<nupN&&pi<tot;slot++,pi++){
      const col=slot%cols,row=Math.floor(slot/cols);
      const srcPg=await pdf.getPage(pi+1);
      const vp=srcPg.getViewport({scale:1});
      const sc=Math.min(cw/vp.width,ch/vp.height)*.93;
      const svp=srcPg.getViewport({scale:sc});
      const cv=document.createElement('canvas');cv.width=svp.width;cv.height=svp.height;
      await srcPg.render({canvasContext:cv.getContext('2d'),viewport:svp}).promise;
      const jd=await fetch(cv.toDataURL('image/jpeg',.88)).then(r=>r.arrayBuffer());
      const img=await newDoc.embedJpg(new Uint8Array(jd));
      const x=col*cw+(cw-svp.width)/2,y=th-(row+1)*ch+(ch-svp.height)/2;
      outPg.drawImage(img,{x,y,width:svp.width,height:svp.height});
      setPrg(10+(pi/tot)*80,`Page ${pi+1}/${tot}…`);
    }
  }
  savePdf(await newDoc.save(),files[0].name.replace(/\.pdf$/i,'')+`_${nupN}up.pdf`);
}

async function doPort(){
  const title=document.getElementById('portTitle')?.value||'My PDF Portfolio';
  const out=await PDFLib.PDFDocument.create();
  out.setTitle(title);out.setCreator('The PDF Factory by Smit Parekh');
  const fn=await out.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const fn2=await out.embedFont(PDFLib.StandardFonts.Helvetica);
  const cover=out.addPage();const{width:cw,height:ch}=cover.getSize();
  // Cover page
  cover.drawRectangle({x:0,y:0,width:cw,height:ch,color:PDFLib.rgb(.04,.07,.18)});
  cover.drawRectangle({x:0,y:ch-6,width:cw,height:6,color:PDFLib.rgb(.96,.44,.14)});
  cover.drawText('📁',{x:cw/2-30,y:ch-130,size:60,font:fn,color:PDFLib.rgb(1,1,1)});
  cover.drawText(title,{x:50,y:ch-200,size:28,font:fn,color:PDFLib.rgb(1,1,1)});
  cover.drawText(`${files.length} document(s) · Created ${new Date().toLocaleString()}`,{x:50,y:ch-240,size:11,font:fn2,color:PDFLib.rgb(.6,.7,.9)});
  files.forEach((f,j)=>{cover.drawText(`${j+1}. ${f.name}  (${fmtSz(f.size)})`,{x:50,y:ch-280-j*22,size:10,font:fn2,color:PDFLib.rgb(.8,.85,.95)})});
  for(let i=0;i<files.length;i++){
    const bytes=await files[i].arrayBuffer();const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
    const pgs=await out.copyPages(doc,doc.getPageIndices());pgs.forEach(p=>out.addPage(p));
    setPrg(10+((i+1)/files.length)*80,`Adding ${files[i].name}…`);
  }
  savePdf(await out.save(),'portfolio.pdf');
}
